<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="เงินพอใช้ แอปติดตามค่าขนมรายวันสำหรับนักเรียน บันทึกรายจ่าย แยกมื้ออาหาร และแบ่งงบ 50/30/20">
<meta name="theme-color" content="#0b8266">
<title>เงินพอใช้</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: การ์ดแก้วลอยบนพื้นไล่สี, Dock ลอยล่างจอ, ฟอร์มบันทึกเป็น bottom sheet */
:root{
  --bg:#e6f0ec;
  --blob1:rgba(120,220,190,.62);--blob2:rgba(150,170,250,.46);--blob3:rgba(255,190,160,.46);
  --ink:#14302a;--ink2:#40605a;--mute:#5d7a73;
  --glass:rgba(255,255,255,.58);--glass2:rgba(255,255,255,.8);--solid:#f6fbf9;
  --line:rgba(255,255,255,.8);--line2:rgba(20,48,42,.14);
  --accent:#0b8266;--accent-ink:#ffffff;
  --need:#2a62c9;--want:#c9501f;--save:#0b8266;--inc:#7a4fb5;
  --ok:#0b8266;--warn:#9a6200;--bad:#c42f2f;
  --shadow:0 10px 30px rgba(20,48,42,.12);
  --scrim:rgba(10,25,21,.45);--dock:rgba(255,255,255,.86);
  --f-disp:'Bai Jamjuree','Noto Sans Thai','Sarabun','Thonburi','Tahoma',sans-serif;
  --f-body:'Noto Sans Thai','Sarabun','Thonburi','Tahoma',sans-serif;
  --r:20px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1816;
    --blob1:rgba(23,120,100,.45);--blob2:rgba(55,70,170,.4);--blob3:rgba(150,70,40,.3);
    --ink:#e7f3ef;--ink2:#b3cbc4;--mute:#8aa79f;
    --glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.13);--solid:#14231f;
    --line:rgba(255,255,255,.14);--line2:rgba(255,255,255,.14);
    --accent:#46d3ae;--accent-ink:#06231b;
    --need:#86adff;--want:#ff9a70;--save:#46d3ae;--inc:#c3a2ff;
    --ok:#46d3ae;--warn:#f1bf55;--bad:#ff8080;
    --shadow:0 10px 30px rgba(0,0,0,.35);
    --scrim:rgba(0,0,0,.6);--dock:rgba(20,35,31,.88);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1816;
  --blob1:rgba(23,120,100,.45);--blob2:rgba(55,70,170,.4);--blob3:rgba(150,70,40,.3);
  --ink:#e7f3ef;--ink2:#b3cbc4;--mute:#8aa79f;
  --glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.13);--solid:#14231f;
  --line:rgba(255,255,255,.14);--line2:rgba(255,255,255,.14);
  --accent:#46d3ae;--accent-ink:#06231b;
  --need:#86adff;--want:#ff9a70;--save:#46d3ae;--inc:#c3a2ff;
  --ok:#46d3ae;--warn:#f1bf55;--bad:#ff8080;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --scrim:rgba(0,0,0,.6);--dock:rgba(20,35,31,.88);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
   radial-gradient(60% 50% at 10% 6%,var(--blob1),transparent 70%),
   radial-gradient(50% 45% at 94% 16%,var(--blob2),transparent 70%),
   radial-gradient(60% 50% at 62% 104%,var(--blob3),transparent 70%)}
.app{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:18px 130px}
.glass{background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--r);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}
@media (prefers-reduced-transparency:reduce){
  .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--solid)}
}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.brand h1{font:700 24px/1.2 var(--f-disp);letter-spacing:.01em}
.brand p{font-size:13px;color:var(--mute)}
.tools{display:flex;gap:8px}
.ico{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:14px;border:1px solid var(--line2);background:var(--glass2);font-size:13px;font-weight:500}
.ico svg{width:18px;height:18px}
.warnbar{margin-bottom:12px;padding:10px 14px;border-radius:14px;background:var(--glass2);border:1px solid var(--warn);color:var(--warn);font-size:13px}
.exbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;padding:10px 14px;border-radius:14px;background:var(--glass2);border:1px dashed var(--line2);font-size:13px;color:var(--ink2)}

/* generic */
#view{display:flex;flex-direction:column;gap:14px}
.card{padding:16px;min-width:0}
.card h2{font:700 17px/1.3 var(--f-disp);margin-bottom:4px}
.sub{font-size:13px;color:var(--mute)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.num{font-family:var(--f-disp);font-variant-numeric:tabular-nums;font-weight:700}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{padding:12px 14px;border-radius:16px;background:var(--glass2);border:1px solid var(--line2);min-width:0}
.g3 .stat:last-child{min-width:0}
@media (max-width:560px){.g3 .stat:last-child{grid-column:1/-1}}
.stat .l{font-size:12px;color:var(--mute)}
.stat .v{font:700 22px/1.3 var(--f-disp);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .n{font-size:12px;color:var(--ink2)}
.lv-ok{--lv:var(--ok)}.lv-warn{--lv:var(--warn)}.lv-over{--lv:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;border:1px solid var(--lv,var(--line2));color:var(--lv,var(--ink2));font-size:12px;font-weight:600;background:var(--glass2)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--lv,var(--mute))}
.bar{height:12px;border-radius:99px;background:var(--line2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--lv,var(--accent));transition:width .35s ease}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}*{scroll-behavior:auto!important}}

/* buttons */
.btn{min-height:44px;padding:0 16px;border-radius:14px;border:1px solid var(--line2);background:var(--glass2);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row2{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:flex;gap:4px;padding:4px;border-radius:16px;background:var(--glass2);border:1px solid var(--line2)}
.seg button{flex:1;min-width:0;min-height:40px;padding:0 8px;border:0;border-radius:12px;background:transparent;font-size:14px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--line2);background:var(--glass2);font-size:13px;font-weight:500}
.chip.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.lnk{background:none;border:0;padding:0 4px;color:var(--accent);font-weight:700;text-decoration:underline;min-height:32px}

/* today hero */
.hero{padding:18px}
.hero .big{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px;margin:6px 0 12px}
.hero .big .num{font-size:clamp(44px,12vw,64px);line-height:1;color:var(--lv)}
.hero .big span.t{font-size:15px;color:var(--ink2)}
.hero .msg{margin-top:10px;font-size:14px;color:var(--ink2)}

/* week chart */
.wk{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:12px}
.wk-area{position:absolute;left:0;right:0;top:0;height:132px;pointer-events:none}
.wk-line{position:absolute;left:0;right:0;border-top:1.5px dashed var(--ink2);opacity:.7}
.wk-line b{position:absolute;right:0;top:-18px;font-size:11px;font-weight:600;color:var(--ink2)}
.wk-col{display:flex;flex-direction:column;align-items:center;min-width:0}
.wk-bars{height:132px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.wk-bar{width:70%;max-width:36px;min-height:3px;border-radius:8px 8px 3px 3px;background:var(--lv,var(--accent));position:relative}
.wk-bar.fut{background:var(--line2)}
.wk-bar em{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);font-style:normal;font-size:11px;font-weight:600;white-space:nowrap;color:var(--ink2);font-variant-numeric:tabular-nums;padding-bottom:2px}
.wk-d{margin-top:6px;font-size:12px;color:var(--mute)}
.wk-col.now .wk-d{color:var(--accent);font-weight:700}

/* list rows */
ul.list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--glass2);border:1px solid var(--line2);min-width:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--mute)}
.b-need{background:var(--need)}.b-want{background:var(--want)}.b-save{background:var(--save)}.b-inc{background:var(--inc)}
.rmain{flex:1;min-width:0}
.rname{font-weight:600;overflow-wrap:anywhere}
.rmeta{font-size:12px;color:var(--mute)}
.ramt{font:700 16px var(--f-disp);font-variant-numeric:tabular-nums;white-space:nowrap}
.ramt.plus{color:var(--inc)}
.x{min-height:36px;padding:0 10px;border-radius:10px;border:1px solid var(--line2);background:transparent;font-size:12px;color:var(--mute)}
.tag-ex{font-size:11px;padding:1px 7px;border-radius:99px;border:1px dashed var(--mute);color:var(--mute);font-weight:500}
.empty{padding:18px 6px 6px;text-align:center;color:var(--ink2)}
.empty .row2{justify-content:center;margin-top:12px}
.dayh{display:flex;justify-content:space-between;gap:8px;margin-top:14px;font-size:13px;font-weight:700;color:var(--ink2)}

/* canteen + plan bars */
.hb{display:grid;grid-template-columns:84px 1fr auto;align-items:center;gap:10px;margin-top:10px}
.hb .nm{font-size:14px;font-weight:600}
.hb .vl{font:700 15px var(--f-disp);font-variant-numeric:tabular-nums;text-align:right;min-width:70px}
.bk{padding:14px;border-radius:16px;background:var(--glass2);border:1px solid var(--line2)}
.bk .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.bk .hd b{font:700 16px var(--f-disp)}
.bk .pc{font:700 20px var(--f-disp);font-variant-numeric:tabular-nums}
.bk .ln{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink2);margin:8px 0 6px;flex-wrap:wrap}
.bk.need{--lv:var(--need)}.bk.want{--lv:var(--want)}.bk.save{--lv:var(--save)}
.bk.over{--lv:var(--bad)}
.bk .st{margin-top:8px;font-size:13px;font-weight:600;color:var(--lv)}
input[type=range]{width:100%;accent-color:var(--accent);min-height:32px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label,.lbl{font-size:13px;font-weight:600;color:var(--ink2)}
.in{width:100%;min-height:44px;padding:9px 12px;border-radius:12px;border:1px solid var(--line2);background:var(--glass2);color:var(--ink);font:inherit}
textarea.in{min-height:110px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.amt{font:700 28px var(--f-disp);font-variant-numeric:tabular-nums}
.hints{margin:8px 0 0;padding-left:18px;color:var(--ink2);font-size:14px}
.hints li{margin-top:4px}
.err{color:var(--bad);font-size:13px;min-height:18px}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mnav b{font:700 17px var(--f-disp)}

/* dock */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;
  display:flex;align-items:center;gap:2px;padding:6px;border-radius:28px;width:min(460px,calc(100% - 24px));background:var(--dock)}
.dock button{flex:1;min-width:0;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;border-radius:20px;background:transparent;font-size:11px;font-weight:600;color:var(--mute)}
.dock button svg{width:22px;height:22px}
.dock button[aria-current="page"]{color:var(--accent);background:var(--glass2)}
.dock .add{flex:none;width:56px;height:56px;min-height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);margin-inline:4px}
.dock .add svg{width:26px;height:26px}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:40;
  display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:16px;max-width:calc(100% - 24px);font-size:14px;font-weight:500;background:var(--solid)}
.toast.warn{border-color:var(--bad)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.sheet-card{width:min(520px,100%);max-height:94%;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));border-radius:24px 24px 0 0;background:var(--solid);
  border:1px solid var(--line2);display:flex;flex-direction:column;gap:14px}
@media (min-width:600px){.sheet{align-items:center}.sheet-card{border-radius:24px}}
.sheet-card h2{font:700 19px var(--f-disp)}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:8px}

@media (max-width:420px){.hb{grid-template-columns:70px 1fr auto}.ico span{display:none}}
@media print{
  @page{size:A4 landscape;margin:12mm}
  .dock,.toast,.sheet,.tools,.bg,.exbar,.warnbar{display:none!important}
  body{background:#fff;color:#000}
  .glass,.stat,.row,.bk{box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;background:#fff;border:1px solid #aaa}
  .app{padding-block:0}
}
</style>
</head>
<body>

<div class="bg" aria-hidden="true"></div>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>เงินพอใช้</h1>
      <p id="today-label">ติดตามค่าขนมรายวัน</p>
    </div>
    <div class="tools">
      <button class="ico" type="button" data-act="theme" aria-label="สลับโหมดสว่างและมืด">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><span>ธีม</span>
      </button>
      <button class="ico" type="button" data-act="go" data-v="settings" aria-label="ตั้งค่า">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg><span>ตั้งค่า</span>
      </button>
    </div>
  </header>
  <div id="warn" class="warnbar" role="alert" hidden>เบราว์เซอร์นี้เก็บข้อมูลไม่ได้ (โหมดส่วนตัวหรือปิดการเก็บข้อมูล) รายการที่บันทึกจะหายเมื่อปิดหน้านี้ ใช้ปุ่ม "สำรองข้อมูล" ในหน้าตั้งค่าเก็บไว้ก่อนปิด</div>
  <main id="view"></main>
</div>

<nav class="dock glass" aria-label="เมนูหลัก">
  <button type="button" data-act="go" data-v="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>วันนี้</button>
  <button type="button" data-act="go" data-v="food"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v7a2 2 0 0 0 4 0V3M9 3v18M17 3c-2 2-3 5-3 8h3v10"/></svg>มื้ออาหาร</button>
  <button type="button" class="add" data-act="add" aria-label="บันทึกรายการใหม่"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <button type="button" data-act="go" data-v="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>แบ่งงบ</button>
  <button type="button" data-act="go" data-v="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>ประวัติ</button>
</nav>

<div id="toast" class="toast glass" role="status" aria-live="polite" hidden><span id="toastMsg"></span><button id="toastBtn" type="button" class="lnk" data-act="undo" hidden>เลิกทำ</button></div>

<div id="sheet" class="sheet" hidden>
  <form id="form" class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="shTitle" novalidate>
    <div class="sh-head">
      <h2 id="shTitle">บันทึกรายการ</h2>
      <button type="button" class="btn sm" data-act="close">ปิด</button>
    </div>
    <div class="seg" role="group" aria-label="ประเภทรายการ">
      <button type="button" data-act="kind" data-v="spend">จ่าย</button>
      <button type="button" data-act="kind" data-v="save">ออม</button>
      <button type="button" data-act="kind" data-v="income">ได้เงินเพิ่ม</button>
    </div>
    <div class="fld">
      <label for="fAmt">จำนวนเงิน (บาท)</label>
      <input id="fAmt" class="in amt" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
      <div class="chips" aria-label="จำนวนที่ใช้บ่อย">
        <button type="button" class="chip" data-act="amt" data-v="10">10</button>
        <button type="button" class="chip" data-act="amt" data-v="20">20</button>
        <button type="button" class="chip" data-act="amt" data-v="30">30</button>
        <button type="button" class="chip" data-act="amt" data-v="50">50</button>
        <button type="button" class="chip" data-act="amt" data-v="100">100</button>
      </div>
    </div>
    <div id="grpPreset" class="fld">
      <span class="lbl">เลือกเร็ว</span>
      <div class="chips">
        <button type="button" class="chip" data-act="preset" data-v="bk">อาหารเช้า</button>
        <button type="button" class="chip" data-act="preset" data-v="lunch">ข้าวกลางวัน</button>
        <button type="button" class="chip" data-act="preset" data-v="boba">ชานมไข่มุก</button>
        <button type="button" class="chip" data-act="preset" data-v="snack">ขนม</button>
        <button type="button" class="chip" data-act="preset" data-v="bus">ค่าเดินทาง</button>
        <button type="button" class="chip" data-act="preset" data-v="supply">อุปกรณ์การเรียน</button>
      </div>
    </div>
    <div id="grpSpend" class="fld">
      <span class="lbl">ซื้ออะไร ประเภทไหน</span>
      <div class="seg" role="group" aria-label="หมวดจำเป็นหรืออยากได้">
        <button type="button" data-act="bucket" data-v="need">จำเป็น</button>
        <button type="button" data-act="bucket" data-v="want">อยากได้</button>
      </div>
      <select id="fTag" class="in" aria-label="หมวดรายการ">
        <option value="food">อาหาร/เครื่องดื่ม</option>
        <option value="travel">เดินทาง</option>
        <option value="study">การเรียน</option>
        <option value="fun">สนุก/เที่ยว</option>
        <option value="other">อื่นๆ</option>
      </select>
    </div>
    <div id="grpMeal" class="fld">
      <span class="lbl">มื้อไหน</span>
      <div class="seg" role="group" aria-label="มื้ออาหาร">
        <button type="button" data-act="meal" data-v="bk">เช้า</button>
        <button type="button" data-act="meal" data-v="lunch">กลางวัน</button>
        <button type="button" data-act="meal" data-v="snack">ขนม/ชานม</button>
        <button type="button" data-act="meal" data-v="dinner">เย็น</button>
      </div>
    </div>
    <div class="fld">
      <label for="fLbl">โน้ตสั้นๆ (ไม่ใส่ก็ได้)</label>
      <input id="fLbl" class="in" type="text" maxlength="40" autocomplete="off" placeholder="เช่น ข้าวมันไก่">
    </div>
    <div class="fld">
      <label for="fDate">วันที่</label>
      <input id="fDate" class="in" type="date">
    </div>
    <div id="fErr" class="err" role="alert"></div>
    <div class="row2">
      <button type="submit" class="btn primary" style="flex:1">บันทึก</button>
      <button type="button" class="btn" data-act="close">ยกเลิก</button>
    </div>
  </form>
</div>

<script>
(function(){
'use strict';

var KEY='smw_v1';
var BUCKETS={need:'จำเป็น',want:'อยากได้',save:'เงินออม'};
var TAGS={food:'อาหาร/เครื่องดื่ม',travel:'เดินทาง',study:'การเรียน',fun:'สนุก/เที่ยว',other:'อื่นๆ'};
var MEALS={bk:'เช้า',lunch:'กลางวัน',snack:'ขนม/ชานม',dinner:'เย็น'};
var MEAL_NAME={bk:'อาหารเช้า',lunch:'อาหารกลางวัน',snack:'ขนม/ชานม',dinner:'อาหารเย็น'};
var MEAL_ORDER=['bk','lunch','snack','dinner'];
var DOW=['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
var MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
var PRESETS={
  bk:{n:'อาหารเช้า',b:'need',t:'food',m:'bk'},
  lunch:{n:'ข้าวกลางวัน',b:'need',t:'food',m:'lunch'},
  boba:{n:'ชานมไข่มุก',b:'want',t:'food',m:'snack'},
  snack:{n:'ขนม',b:'want',t:'food',m:'snack'},
  bus:{n:'ค่าเดินทาง',b:'need',t:'travel',m:''},
  supply:{n:'อุปกรณ์การเรียน',b:'need',t:'study',m:''}
};

/* ---------- ข้อมูล (v1) ----------
 {v:1, seq, settings:{mode,amount,split:{need,want,save},theme},
  tx:[{id,d,k,b,t,m,a,n,g,w,c,x}],
  goals:[{id,name,target,saved,due,ic}],      // สำรองไว้ให้ Piggy Bank Goal Tracker
  wishes:[{id,name,price,kind,added,cool}]}   // สำรองไว้ให้ Wishlist / Cooling-Off
 tx.g = id ของเป้าหมายออม, tx.w = id ของรายการในวิชลิสต์ (ยังเป็น null ใน v1) */
var storageOk=true;
var S=null;
var ui={v:'today',cr:'week',hm:'',hf:'all',exp:false,imp:false};
var form={k:'spend',b:'need',t:'food',m:'lunch'};
var lastDel=null,toastTimer=null,lastFocus=null,themeTouched=false;

function defaults(){
  return {v:1,seq:1,settings:{mode:'daily',amount:100,split:{need:50,want:30,save:20},theme:'auto'},tx:[],goals:[],wishes:[]};
}
function num(x,min,max,def){x=Number(x);if(!isFinite(x))return def;if(x<min)return min;if(x>max)return max;return x;}
function str(x,max){if(typeof x!=='string')return '';return x.replace(/[<>]/g,'').slice(0,max);}
function r2(n){return Math.round(n*100)/100;}
function validDate(s){
  if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;
  var p=s.split('-'),y=+p[0],m=+p[1],d=+p[2];
  if(y<2000||y>2100)return false;
  var t=new Date(y,m-1,d);
  return t.getFullYear()===y&&t.getMonth()===m-1&&t.getDate()===d;
}
function sanitize(raw){
  var o=defaults(),i;
  if(!raw||typeof raw!=='object'||Array.isArray(raw))return o;
  var st=raw.settings;
  if(st&&typeof st==='object'){
    o.settings.mode=st.mode==='weekly'?'weekly':'daily';
    o.settings.amount=r2(num(st.amount,0,100000,100));
    o.settings.theme=(st.theme==='light'||st.theme==='dark')?st.theme:'auto';
    var sp=st.split;
    if(sp&&typeof sp==='object'){
      var a=Math.round(num(sp.need,0,100,50)),b=Math.round(num(sp.want,0,100,30));
      if(a+b>100)b=100-a;
      o.settings.split={need:a,want:b,save:100-a-b};
    }
  }
  var arr=Array.isArray(raw.tx)?raw.tx.slice(0,5000):[],seen={},maxId=0,list=[];
  for(i=0;i<arr.length;i++){
    var t=arr[i];
    if(!t||typeof t!=='object')continue;
    var k=(t.k==='save'||t.k==='income')?t.k:'spend';
    var amt=r2(num(t.a,0,100000,0));
    if(amt<=0||!validDate(t.d))continue;
    var id=Math.floor(num(t.id,1,1e9,0));
    if(!id||seen[id])id=0;else{seen[id]=1;if(id>maxId)maxId=id;}
    var tag=TAGS[t.t]?t.t:'other';
    var item={id:id,d:t.d,k:k,b:null,t:'other',m:'',a:amt,n:str(t.n,40),g:null,w:null,c:Math.floor(num(t.c,0,4e12,0)),x:t.x?1:0};
    if(k==='spend'){
      item.b=t.b==='need'?'need':'want';
      item.t=tag;
      if(tag==='food')item.m=MEALS[t.m]?t.m:'snack';
    }else if(k==='save'){item.b='save';}
    if(t.g!=null)item.g=Math.floor(num(t.g,1,1e9,0))||null;
    if(t.w!=null)item.w=Math.floor(num(t.w,1,1e9,0))||null;
    list.push(item);
  }
  var seq=Math.max(maxId,Math.floor(num(raw.seq,1,1e9,1)-1));
  for(i=0;i<list.length;i++){if(!list[i].id)list[i].id=++seq;}
  o.tx=list;o.seq=seq+1;
  var g=Array.isArray(raw.goals)?raw.goals.slice(0,200):[];
  for(i=0;i<g.length;i++){
    var q=g[i];if(!q||typeof q!=='object')continue;
    var gid=Math.floor(num(q.id,1,1e9,0));if(!gid)continue;
    o.goals.push({id:gid,name:str(q.name,40),target:r2(num(q.target,0,1e7,0)),saved:r2(num(q.saved,0,1e7,0)),due:validDate(q.due)?q.due:'',ic:str(q.ic,4)});
  }
  var w=Array.isArray(raw.wishes)?raw.wishes.slice(0,500):[];
  for(i=0;i<w.length;i++){
    var z=w[i];if(!z||typeof z!=='object')continue;
    var wid=Math.floor(num(z.id,1,1e9,0));if(!wid)continue;
    o.wishes.push({id:wid,name:str(z.name,40),price:r2(num(z.price,0,1e7,0)),kind:z.kind==='need'?'need':'want',added:Math.floor(num(z.added,0,4e12,0)),cool:Math.floor(num(z.cool,0,4e12,0))});
  }
  return o;
}
function load(){
  try{
    var r=localStorage.getItem(KEY);
    S=sanitize(r?JSON.parse(r):null);
  }catch(e){storageOk=false;S=defaults();}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));storageOk=true;}
  catch(e){storageOk=false;}
  $('warn').hidden=storageOk;
}

/* ---------- วันที่/ตัวเลข ---------- */
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return n<10?'0'+n:''+n;}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function pd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(s,n){var d=pd(s);d.setDate(d.getDate()+n);return iso(d);}
function today(){return iso(new Date());}
function dayIdx(s){return (pd(s).getDay()+6)%7;}
function weekStart(s){return addDays(s,-dayIdx(s));}
function dlabel(s){var d=pd(s);return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()];}
function mlabel(ym){var p=ym.split('-');return MON[+p[1]-1]+' '+(+p[0]+543);}
function fmt(n){
  n=r2(n);var neg=n<0;n=Math.abs(n);
  var s=(n%1===0)?String(n):n.toFixed(2),p=s.split('.');
  p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return (neg?'-':'')+p.join('.');
}
function baht(n){return n<0?'-฿'+fmt(-n):'฿'+fmt(n);}

/* ---------- คำนวณ ---------- */
function weeklyBudget(){return S.settings.mode==='weekly'?S.settings.amount:S.settings.amount*7;}
function dailyBudget(){return S.settings.mode==='daily'?S.settings.amount:S.settings.amount/7;}
function sumTx(from,to,k,fn){
  var s=0,i,t;
  for(i=0;i<S.tx.length;i++){
    t=S.tx[i];
    if(t.k!==k||t.d<from||t.d>to)continue;
    if(fn&&!fn(t))continue;
    s+=t.a;
  }
  return r2(s);
}
function level(spent,budget){
  if(budget<=0)return spent>0?'over':'ok';
  var r=spent/budget;
  return r>1?'over':(r>=0.8?'warn':'ok');
}
function sorted(fn){
  var out=[],i;
  for(i=0;i<S.tx.length;i++){if(!fn||fn(S.tx[i]))out.push(S.tx[i]);}
  out.sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:(b.c-a.c)||(b.id-a.id);});
  return out;
}
function hasExample(){for(var i=0;i<S.tx.length;i++){if(S.tx[i].x)return true;}return false;}
function rowName(t){
  if(t.n)return t.n;
  if(t.k==='save')return 'เงินออม';
  if(t.k==='income')return 'เงินที่ได้เพิ่ม';
  if(t.t==='food'&&t.m)return MEAL_NAME[t.m];
  return TAGS[t.t];
}

/* ---------- หน้าจอ ---------- */
function rowHtml(t,showDate){
  var meta=[],cls;
  if(showDate)meta.push(dlabel(t.d));
  if(t.k==='spend'){meta.push(BUCKETS[t.b]);meta.push(t.t==='food'&&t.m?MEALS[t.m]:TAGS[t.t]);cls=t.b;}
  else if(t.k==='save'){meta.push('ออมเงิน');cls='save';}
  else{meta.push('รายรับพิเศษ');cls='inc';}
  var nm=rowName(t);
  return '<li class="row"><span class="dot b-'+cls+'" aria-hidden="true"></span><div class="rmain"><div class="rname">'+esc(nm)+(t.x?' <span class="tag-ex">ตัวอย่าง</span>':'')+'</div><div class="rmeta">'+esc(meta.join(' · '))+'</div></div><div class="ramt'+(t.k==='income'?' plus':'')+'">'+(t.k==='income'?'+':'')+baht(t.a)+'</div><button type="button" class="x" data-act="del" data-id="'+t.id+'" aria-label="ลบรายการ '+esc(nm)+'">ลบ</button></li>';
}

function vToday(){
  var t=today(),db=dailyBudget(),sp=sumTx(t,t,'spend'),lv=level(sp,db),left=r2(db-sp);
  var ws=weekStart(t),we=addDays(ws,6);
  var wsp=sumTx(ws,we,'spend'),wsv=sumTx(ws,we,'save'),winc=sumTx(ws,we,'income');
  var base=weeklyBudget()+winc,wl=r2(base-wsp-wsv);
  var daysLeft=7-dayIdx(t),perDay=Math.max(0,wl)/daysLeft;
  var pct=db>0?Math.min(100,sp/db*100):(sp>0?100:0);
  var msg,bigLbl;
  if(lv==='over'){msg='เกินงบวันนี้ '+baht(sp-db)+' พรุ่งนี้ลองใช้น้อยลงอีกนิด';bigLbl='เกินงบวันนี้';}
  else if(lv==='warn'){msg='ใกล้เต็มงบวันนี้แล้ว เหลืออีก '+baht(left);bigLbl='เหลือใช้วันนี้';}
  else{msg='ยังอยู่ในงบ ใช้ได้อีก '+baht(left);bigLbl='เหลือใช้วันนี้';}
  var big=left<0?baht(-left):baht(left);
  var wlv=level(wsp+wsv,base);
  var h=[];
  if(hasExample()){
    h.push('<div class="exbar"><span>กำลังแสดงข้อมูลตัวอย่าง ไม่ใช่เงินของคุณ</span><button type="button" class="btn sm" data-act="clearsample">ล้างตัวอย่าง</button></div>');
  }
  h.push('<section class="card glass hero lv-'+lv+'" aria-label="ภาพรวมวันนี้">');
  h.push('<div class="eyebrow">ภาพรวมวันนี้</div>');
  h.push('<div class="big"><span class="num">'+big+'</span><span class="t">'+bigLbl+'</span><span class="pill">'+(lv==='over'?'เกินงบ':lv==='warn'?'ใกล้เต็ม':'อยู่ในงบ')+'</span></div>');
  h.push('<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+Math.round(pct)+'" aria-label="สัดส่วนที่ใช้ของงบวันนี้"><i style="width:'+pct+'%"></i></div>');
  h.push('<p class="msg">'+esc(msg)+'</p>');
  h.push('</section>');
  h.push('<section class="grid g3" aria-label="สรุป">');
  h.push('<div class="stat glass"><div class="l">ใช้ไปวันนี้</div><div class="v">'+baht(sp)+'</div><div class="n">จากงบ '+baht(db)+'/วัน</div></div>');
  h.push('<div class="stat glass lv-'+wlv+'"><div class="l">สัปดาห์นี้ (ใช้+ออม)</div><div class="v">'+baht(wsp+wsv)+'</div><div class="n">จากทั้งหมด '+baht(base)+'</div></div>');
  h.push('<div class="stat glass"><div class="l">ถ้าอยากให้พอถึงอาทิตย์</div><div class="v">'+baht(perDay)+'</div><div class="n">ใช้ได้วันละ (อีก '+daysLeft+' วัน)</div></div>');
  h.push('</section>');
  /* กราฟ 7 วัน */
  var vals=[],mx=Math.max(db*1.4,1),i,d;
  for(i=0;i<7;i++){d=addDays(ws,i);vals.push(sumTx(d,d,'spend'));if(vals[i]>mx)mx=vals[i];}
  h.push('<section class="card glass"><h2>ใช้ไปแต่ละวันสัปดาห์นี้</h2><p class="sub">เส้นประคืองบต่อวัน '+baht(db)+'</p><div class="wk">');
  h.push('<div class="wk-area" aria-hidden="true"><div class="wk-line" style="bottom:'+(db/mx*100)+'%"><b>'+baht(db)+'</b></div></div>');
  for(i=0;i<7;i++){
    d=addDays(ws,i);
    var fut=d>t,l=level(vals[i],db),hh=vals[i]>0?Math.max(3,vals[i]/mx*132):3;
    h.push('<div class="wk-col'+(d===t?' now':'')+'"><div class="wk-bars"><div class="wk-bar lv-'+l+(fut?' fut':'')+'" style="height:'+hh+'px">'+(vals[i]>0?'<em>'+fmt(vals[i])+'</em>':'')+'</div></div><div class="wk-d">'+DOW[pd(d).getDay()]+'</div></div>');
  }
  h.push('</div></section>');
  /* รายการวันนี้ */
  var items=sorted(function(x){return x.d===t;});
  h.push('<section class="card glass"><h2>รายการวันนี้</h2>');
  if(!items.length){
    h.push('<div class="empty"><p>ยังไม่มีรายการวันนี้ กดปุ่ม + ด้านล่างเพื่อบันทึก</p><div class="row2"><button type="button" class="btn primary" data-act="add">บันทึกรายการแรก</button>'+(S.tx.length===0?'<button type="button" class="btn" data-act="sample">ลองข้อมูลตัวอย่าง</button>':'')+'</div></div>');
  }else{
    h.push('<ul class="list">');
    for(i=0;i<items.length;i++)h.push(rowHtml(items[i],false));
    h.push('</ul>');
  }
  h.push('</section>');
  return h.join('');
}

function vFood(){
  var t=today(),from,to,days,lbl;
  if(ui.cr==='week'){from=weekStart(t);to=addDays(from,6);days=dayIdx(t)+1;lbl='สัปดาห์นี้ (จันทร์ถึงอาทิตย์)';}
  else{from=t.slice(0,8)+'01';to=t.slice(0,8)+'31';days=pd(t).getDate();lbl='เดือน '+mlabel(t.slice(0,7));}
  var items=sorted(function(x){return x.k==='spend'&&x.t==='food'&&x.d>=from&&x.d<=to;});
  var tot=0,by={},cnt={},i,m;
  for(i=0;i<MEAL_ORDER.length;i++){by[MEAL_ORDER[i]]=0;cnt[MEAL_ORDER[i]]=0;}
  for(i=0;i<items.length;i++){tot+=items[i].a;by[items[i].m]+=items[i].a;cnt[items[i].m]++;}
  tot=r2(tot);
  var mx=1;for(i=0;i<MEAL_ORDER.length;i++){if(by[MEAL_ORDER[i]]>mx)mx=by[MEAL_ORDER[i]];}
  var top=null;for(i=0;i<MEAL_ORDER.length;i++){if(by[MEAL_ORDER[i]]>0&&(top===null||by[MEAL_ORDER[i]]>by[top]))top=MEAL_ORDER[i];}
  var h=[];
  h.push('<section class="card glass"><div class="mnav"><div><h2>ค่าอาหารแยกตามมื้อ</h2><p class="sub">'+esc(lbl)+'</p></div></div>');
  h.push('<div class="seg" style="margin-top:12px" role="group" aria-label="ช่วงเวลา"><button type="button" data-act="cr" data-v="week" class="'+(ui.cr==='week'?'on':'')+'">สัปดาห์นี้</button><button type="button" data-act="cr" data-v="month" class="'+(ui.cr==='month'?'on':'')+'">เดือนนี้</button></div></section>');
  h.push('<section class="grid g3"><div class="stat glass"><div class="l">รวมค่าอาหาร</div><div class="v">'+baht(tot)+'</div><div class="n">'+items.length+' รายการ</div></div>');
  h.push('<div class="stat glass"><div class="l">เฉลี่ยต่อวัน</div><div class="v">'+baht(tot/days)+'</div><div class="n">นับ '+days+' วันที่ผ่านมา</div></div>');
  h.push('<div class="stat glass"><div class="l">มื้อที่เสียมากสุด</div><div class="v">'+(top?esc(MEALS[top]):'-')+'</div><div class="n">'+(top?baht(by[top]):'ยังไม่มีข้อมูล')+'</div></div></section>');
  h.push('<section class="card glass"><h2>แยกตามมื้อ</h2>');
  for(i=0;i<MEAL_ORDER.length;i++){
    m=MEAL_ORDER[i];
    h.push('<div class="hb"><span class="nm">'+MEALS[m]+'</span><div class="bar" style="--lv:'+(m==='snack'?'var(--want)':'var(--need)')+'"><i style="width:'+(by[m]/mx*100)+'%"></i></div><span class="vl">'+baht(by[m])+'</span></div><div class="sub" style="margin-left:94px">'+cnt[m]+' ครั้ง'+(cnt[m]?' · เฉลี่ย '+baht(by[m]/cnt[m])+'/ครั้ง':'')+'</div>');
  }
  if(cnt.snack>=2&&tot>0){
    h.push('<p class="sub" style="margin-top:14px">ขนม/ชานม คิดเป็น '+Math.round(by.snack/tot*100)+'% ของค่าอาหาร ถ้าเว้นสัปดาห์ละ 1 ครั้ง จะประหยัดได้ราว '+baht(by.snack/cnt.snack*4)+' ต่อเดือน</p>');
  }
  h.push('</section>');
  h.push('<section class="card glass"><h2>รายการอาหารล่าสุด</h2>');

function planBase(){
  var t=today(),ws=weekStart(t),we=addDays(ws,6);
  return {ws:ws,we:we,allow:weeklyBudget(),inc:sumTx(ws,we,'income')};
}
function planCards(){
  var p=planBase(),base=p.allow+p.inc,sp=S.settings.split,h=[],keys=['need','want','save'],i;
  for(i=0;i<3;i++){
    var k=keys[i],pc=sp[k],al=r2(base*pc/100),used;
    if(k==='save')used=sumTx(p.ws,p.we,'save');
    else used=sumTx(p.ws,p.we,'spend',function(x){return x.b===k;});
    var over=k!=='save'&&used>al,ratio=al>0?Math.min(100,used/al*100):(used>0?100:0),st;
    if(k==='save'){st=used>=al&&al>0?'ออมถึงเป้าแล้ว':'ยังขาดอีก '+baht(Math.max(0,al-used))+' ถึงเป้าออม';}
    else if(over){st='เกินที่ตั้งไว้ '+baht(used-al);}
    else{st='เหลือใช้ได้อีก '+baht(al-used);}
    h.push('<div class="bk '+k+(over?' over':'')+'"><div class="hd"><b>'+BUCKETS[k]+'</b><span class="pc">'+pc+'%</span></div><div class="ln"><span>ตั้งไว้ '+baht(al)+'</span><span>'+(k==='save'?'ออมแล้ว ':'ใช้ไป ')+baht(used)+'</span></div><div class="bar"><i style="width:'+ratio+'%"></i></div><div class="st">'+esc(st)+'</div></div>');
  }
  return h.join('');
}
function planHints(){
  var p=planBase(),base=p.allow+p.inc,sp=S.settings.split,hs=[];
  var needU=sumTx(p.ws,p.we,'spend',function(x){return x.b==='need';});
  var wantU=sumTx(p.ws,p.we,'spend',function(x){return x.b==='want';});
  var saveU=sumTx(p.ws,p.we,'save');
  var needA=base*sp.need/100,wantA=base*sp.want/100,saveA=base*sp.save/100;
  if(base<=0)hs.push('ยังไม่ได้ตั้งค่าขนม ไปตั้งค่าที่หน้าตั้งค่าก่อน');
  if(wantU>wantA)hs.push('หมวดอยากได้เกินที่ตั้งไว้ '+baht(wantU-wantA)+' ลองเว้นของกินเล่นสัก 1-2 วัน');
  if(needU>needA)hs.push('หมวดจำเป็นเกินที่ตั้งไว้ '+baht(needU-needA)+' ถ้าเป็นเพราะค่าเดินทางหรืออุปกรณ์การเรียน ลองปรับสัดส่วนให้เหมาะกับชีวิตจริง');
  if(saveU<saveA)hs.push('ยังออมไม่ถึงเป้าสัปดาห์นี้ ใส่เพิ่มอีก '+baht(saveA-saveU)+' ได้ทุกเมื่อ');
  if(!hs.length)hs.push('งบสัปดาห์นี้สมดุลดี รักษาจังหวะนี้ไว้');
  var out='',i;
  for(i=0;i<hs.length;i++)out+='<li>'+esc(hs[i])+'</li>';
  return out;
}

function applyTheme(){
  var th=S.settings.theme,r=document.documentElement;
  if(th==='auto'){if(themeTouched){r.removeAttribute('data-theme');themeTouched=false;}}
  else{r.setAttribute('data-theme',th);themeTouched=true;}
}
function effectiveDark(){
  var a=document.documentElement.getAttribute('data-theme');
  if(a==='dark')return true;
  if(a==='light')return false;
  return !!(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
}

/* ---------- toast ---------- */
function toast(msg,kind,undo){
  var el=$('toast');
  $('toastMsg').textContent=msg;
  $('toastBtn').hidden=!undo;
  el.className='toast glass'+(kind==='warn'?' warn':'');

}

function guessMeal(){var h=new Date().getHours();return h<10?'bk':h<14?'lunch':h<17?'snack':'dinner';}
function syncForm(){
  var q=document.querySelectorAll('#form [data-act]'),i,a,v,on;
  for(i=0;i<q.length;i++){
    a=q[i].getAttribute('data-act');v=q[i].getAttribute('data-v');on=null;
    if(a==='kind')on=form.k===v;
    else if(a==='bucket')on=form.b===v;
    else if(a==='meal')on=form.m===v;
    if(on!==null){q[i].classList.toggle('on',on);q[i].setAttribute('aria-pressed',on?'true':'false');}
  }
  $('fTag').value=form.t;
  $('grpPreset').hidden=form.k!=='spend';
  $('grpSpend').hidden=form.k!=='spend';
  $('grpMeal').hidden=!(form.k==='spend'&&form.t==='food');
  $('shTitle').textContent=form.k==='spend'?'บันทึกรายจ่าย':form.k==='save'?'บันทึกเงินออม':'บันทึกเงินที่ได้เพิ่ม';
  $('fLbl').placeholder=form.k==='spend'?'เช่น ข้าวมันไก่':form.k==='save'?'เช่น เก็บซื้อรองเท้า':'เช่น ได้จากญาติ';
}
function openSheet(kind,amt){
  lastFocus=document.activeElement;
  form={k:kind||'spend',b:'need',t:'food',m:guessMeal()};
  $('fAmt').value=amt?String(amt):'';
  $('fLbl').value='';
  $('fDate').value=today();
  $('fDate').max=today();
  $('fErr').textContent='';
  syncForm();
  $('sheet').hidden=false;
  document.body.classList.add('lock');
  $('fAmt').focus();
}
function closeSheet(){
  $('sheet').hidden=true;
  document.body.classList.remove('lock');
  if(lastFocus&&lastFocus.focus&&document.contains(lastFocus))lastFocus.focus();
}
function parseAmt(v){
  var s=String(v).replace(/,/g,'').trim();
  if(!/^\d+(\.\d{1,2})?$/.test(s))return NaN;
  var n=parseFloat(s);
  return (n>0&&n<=100000)?n:NaN;
}
function submitForm(){
  var a=parseAmt($('fAmt').value),d=$('fDate').value,err=$('fErr');
  if(isNaN(a)){err.textContent='ใส่จำนวนเงินเป็นตัวเลขที่มากกว่า 0 เช่น 35 หรือ 42.50';$('fAmt').focus();return;}
  if(!validDate(d)||d>today()){err.textContent='เลือกวันที่ที่ไม่เกินวันนี้';$('fDate').focus();return;}
  var t={id:S.seq++,d:d,k:form.k,b:null,t:'other',m:'',a:a,n:str($('fLbl').value.trim(),40),g:null,w:null,c:Date.now(),x:0};
  if(form.k==='spend'){t.b=form.b;t.t=form.t;if(form.t==='food')t.m=form.m;}
  else if(form.k==='save'){t.b='save';}
  S.tx.push(t);
  save();
  closeSheet();
  render();
  var msg='บันทึกแล้ว '+baht(a),kind='';
  if(t.k==='spend'&&d===today()){
    var db=dailyBudget(),sp=sumTx(d,d,'spend'),lv=level(sp,db);
    if(lv==='over'){msg='บันทึกแล้ว แต่เกินงบวันนี้ '+baht(sp-db);kind='warn';}
    else if(lv==='warn'){msg='บันทึกแล้ว ใกล้เต็มงบวันนี้ เหลือ '+baht(db-sp);}
  }
  toast(msg,kind,false);
}

  var snk=['ชานมไข่มุก','ขนมปังปิ้ง','ชาเย็น','ไก่ทอด','ชานมไข่มุก','ไอศกรีม','น้ำผลไม้'];

function flashMsg(id,txt){var el=$(id);if(el)el.textContent=txt;}
function confirm2(el,fn){

  var orig=el.textContent;
  el.setAttribute('data-armed','1');

  try{obj=JSON.parse(raw);}catch(e){flashMsg('impMsg','อ่านข้อมูลไม่ได้ ตรวจว่าคัดลอกมาครบทั้งก้อน');return;}
  if(!obj||typeof obj!=='object'||Array.isArray(obj)||!Array.isArray(obj.tx)){flashMsg('impMsg','รูปแบบไม่ตรงกับข้อมูลสำรองของแอปนี้');return;}
  S=sanitize(obj);
  hideToast();
  ui.imp=false;ui.exp=false;
  applyTheme();save();render();
  toast('นำเข้าแล้ว '+S.tx.length+' รายการ');
}

  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){flashMsg('expMsg','คัดลอกแล้ว วางเก็บไว้ในที่ปลอดภัย');},fb);
    }else fb();
  }catch(e){fb();}
}
function downloadExport(){
  try{
    var b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
    var u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download='money-backup-'+today()+'.json';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(u);},2000);
    flashMsg('expMsg','สั่งดาวน์โหลดแล้ว ถ้าไม่มีไฟล์ขึ้น ให้ใช้ปุ่มคัดลอกแทน');
  }catch(e){flashMsg('expMsg','ดาวน์โหลดไม่ได้ในหน้านี้ ใช้ปุ่มคัดลอกแทน');}
}

/* ---------- เหตุการณ์ ---------- */
function liveSplit(){
  var n=+$('spNeed').value,w=+$('spWant').value;
  if(n+w>100)w=100-n;
  $('spWant').max=100-n;$('spWant').value=w;
  S.settings.split={need:n,want:w,save:100-n-w};
  $('lbNeed').textContent=n+'%';$('lbWant').textContent=w+'%';$('lbSave').textContent=(100-n-w)+'%';
  $('planCards').innerHTML=planCards();
  $('planHints').innerHTML=planHints();
}
function act(el){
  var a=el.getAttribute('data-act'),v=el.getAttribute('data-v');
  if(el.getAttribute('data-confirm')==='1'){confirm2(el,function(){act2(a,v,el);});return;}
  act2(a,v,el);
}
function act2(a,v,el){
  switch(a){
    case 'go':ui.v=v;if(v!=='settings'){ui.exp=false;ui.imp=false;}render();window.scrollTo(0,0);break;
    case 'add':openSheet('spend');break;
    case 'close':closeSheet();break;
    case 'kind':form.k=v;syncForm();break;
    case 'bucket':form.b=v;syncForm();break;
    case 'meal':form.m=v;syncForm();break;
    case 'amt':$('fAmt').value=v;$('fAmt').focus();break;
    case 'preset':
      var p=PRESETS[v];form.k='spend';form.b=p.b;form.t=p.t;if(p.m)form.m=p.m;
      $('fLbl').value=p.n;syncForm();$('fAmt').focus();break;
    case 'del':
      var id=+el.getAttribute('data-id'),i;
      for(i=0;i<S.tx.length;i++){
        if(S.tx[i].id===id){
          lastDel={tx:S.tx[i],index:i};
          S.tx.splice(i,1);save();render();
          toast('ลบรายการแล้ว','',true);
          break;
        }
      }
      break;
    case 'undo':
      if(lastDel){
        S.tx.splice(Math.min(lastDel.index,S.tx.length),0,lastDel.tx);
        lastDel=null;save();render();toast('คืนรายการแล้ว');
      }
      break;
    case 'sample':loadSample();break;
    case 'clearsample':
      S.tx=S.tx.filter(function(t){return !t.x;});
      hideToast();save();render();toast('ล้างข้อมูลตัวอย่างแล้ว');break;
    case 'hm':
      var p2=ui.hm.split('-'),dt=new Date(+p2[0],+p2[1]-1+(+el.getAttribute('data-d')),1);
      ui.hm=dt.getFullYear()+'-'+pad(dt.getMonth()+1);render();break;
    case 'hf':ui.hf=v;render();break;
    case 'cr':ui.cr=v;render();break;
    case 'mode':S.settings.mode=v;save();render();break;
    case 'settheme':S.settings.theme=v;applyTheme();save();render();break;
    case 'theme':
      S.settings.theme=effectiveDark()?'light':'dark';
      applyTheme();save();render();break;
    case 'split':
      var q=v.split(',');
      S.settings.split={need:+q[0],want:+q[1],save:+q[2]};
      save();render();break;
    case 'addsave':openSheet('save');break;
    case 'exp':ui.exp=true;render();break;
    case 'showimp':ui.imp=!ui.imp;render();break;
    case 'copyexp':copyExport();break;
    case 'dlexp':downloadExport();break;
    case 'doimp':doImport();break;
    case 'reset':
      S=defaults();hideToast();ui.exp=false;ui.imp=false;
      applyTheme();save();render();toast('ลบข้อมูลทั้งหมดแล้ว');break;
  }
}

function bind(){
  document.addEventListener('click',function(e){
    if(e.target===$('sheet')){closeSheet();return;}
    var el=e.target.closest?e.target.closest('[data-act]'):null;
    if(el&&!el.disabled)act(el);
  });
  $('form').addEventListener('submit',function(e){e.preventDefault();submitForm();});
  document.addEventListener('keydown',function(e){
    if($('sheet').hidden)return;
    if(e.key==='Escape'){closeSheet();return;}
    if(e.key==='Tab'){
      var f=$('form').querySelectorAll('button,input,select,textarea'),vis=[],i;
      for(i=0;i<f.length;i++){if(!f[i].disabled&&f[i].offsetParent!==null)vis.push(f[i]);}
      if(!vis.length)return;
      var first=vis[0],last=vis[vis.length-1];
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
    }
  });
  document.addEventListener('input',function(e){
    var id=e.target.id;
    if(id==='spNeed'||id==='spWant')liveSplit();
  });
  document.addEventListener('change',function(e){
    var id=e.target.id;
    if(id==='fTag'){form.t=e.target.value;syncForm();}
    else if(id==='spNeed'||id==='spWant'){save();}
    else if(id==='sAmt'){
      var n=parseFloat(String(e.target.value).replace(/,/g,'').trim());
      if(!isFinite(n)||n<0||n>100000||!/^[\d,]+(\.\d{1,2})?$/.test(String(e.target.value).trim())){flashMsg('sErr','ใส่ตัวเลข 0 ถึง 100,000');return;}
      S.settings.amount=r2(n);save();render();toast('บันทึกค่าขนมแล้ว');
    }
    else if(id==='impFile'){
      var f=e.target.files&&e.target.files[0];
      if(!f)return;
      if(f.size>5*1024*1024){flashMsg('impMsg','ไฟล์ใหญ่เกิน 5MB');return;}
      var rd=new FileReader();
      rd.onload=function(){$('impTxt').value=String(rd.result||'');flashMsg('impMsg','อ่านไฟล์แล้ว กดนำเข้าเพื่อยืนยัน');};
      rd.onerror=function(){flashMsg('impMsg','อ่านไฟล์ไม่ได้');};
      rd.readAsText(f);
    }
  });
}

load();
applyTheme();
ui.hm=today().slice(0,7);
bind();
render();
})();
</script>
